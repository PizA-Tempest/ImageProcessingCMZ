[theme]
base = "dark"
primaryColor = "#059669"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c2e"
codeBackgroundColor = "#131c2e"
textColor = "#e2e8f0"
linkColor = "#6ee7b7"
borderColor = "#233048"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
codeTextColor = "#a5f3fc"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#60a5fa", "#34d399", "#fbbf24", "#fb923c", "#22d3ee", "#f472b6", "#f87171", "#a78bfa", "#64748b"]

blueColor = "#60a5fa"
greenColor = "#34d399"
yellowColor = "#fbbf24"
orangeColor = "#fb923c"
redColor = "#f87171"
violetColor = "#a78bfa"
grayColor = "#94a3b8"

[theme.sidebar]
backgroundColor = "#0a101c"
secondaryBackgroundColor = "#131c2e"
codeBackgroundColor = "#131c2e"
borderColor = "#1f2a40"
primaryColor = "#059669"
textColor = "#e2e8f0"
